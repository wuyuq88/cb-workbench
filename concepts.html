<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>转债概念映射查询工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #1a1a2e;
  --text-secondary: #6b7280;
  --border: #e5e7eb;
  --primary: #1a56db;
  --primary-light: #eff6ff;
  --core: #dc2626;
  --core-bg: #fef2f2;
  --involve: #d97706;
  --involve-bg: #fffbeb;
  --bandwagon: #6b7280;
  --bandwagon-bg: #f9fafb;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

.header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow);
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  white-space: nowrap;
}

.logo span { color: var(--text-secondary); font-weight: 400; font-size: 13px; }

.stats-badge {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 500;
}

.main { max-width: 1400px; margin: 0 auto; padding: 24px; }

.search-section {
  background: var(--card);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.search-box {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}

.search-input {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
  font-family: inherit;
}

.search-input:focus { border-color: var(--primary); }

.search-input::placeholder { color: #c4c7cc; }

.mode-toggle {
  display: flex;
  gap: 8px;
}

.mode-btn {
  padding: 10px 20px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
  font-family: inherit;
  color: var(--text-secondary);
}

.mode-btn:hover { border-color: var(--primary); color: var(--primary); }
.mode-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

.concept-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.concept-chip {
  padding: 5px 12px;
  border-radius: 16px;
  font-size: 13px;
  border: 1.5px solid var(--border);
  background: white;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  color: var(--text-secondary);
  white-space: nowrap;
}

.concept-chip:hover, .concept-chip.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}

.status-filter-bar {
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
  align-items: center;
  display: flex;
}

.status-filter-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-right: 4px;
}

.status-filter-btn {
  padding: 5px 14px;
  border-radius: 16px;
  font-size: 13px;
  border: 1.5px solid var(--border);
  background: white;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  color: var(--text-secondary);
  white-space: nowrap;
}

.status-filter-btn:hover { border-color: var(--primary); color: var(--primary); }
.status-filter-btn.active { color: white; border-color: transparent; }

.status-filter-btn[data-status="核心"].active { background: var(--core); }
.status-filter-btn[data-status="涉及/参与"].active { background: var(--involve); }
.status-filter-btn[data-status="蹭概念/有潜力"].active { background: var(--bandwagon); }
.status-filter-btn[data-status="全部"].active { background: var(--primary); }

.result-area {
  background: var(--card);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.result-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.result-title {
  font-size: 16px;
  font-weight: 600;
}

.result-count {
  font-size: 13px;
  color: var(--text-secondary);
}

.bond-list {
  max-height: 70vh;
  overflow-y: auto;
}

.bond-item {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
  cursor: pointer;
}

.bond-item:hover { background: #fafbfc; }
.bond-item:last-child { border-bottom: none; }

.bond-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.bond-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.bond-code {
  font-size: 12px;
  color: var(--text-secondary);
  font-family: 'SF Mono', 'Consolas', monospace;
}

.bond-stock {
  font-size: 12px;
  color: var(--text-secondary);
}

.bond-stock::before { content: '·'; margin: 0 6px; }
.bond-stock:first-of-type::before { display: none; }

.bond-industry {
  font-size: 11px;
  padding: 2px 8px;
  background: #f0f5ff;
  color: #5b7fdb;
  border-radius: 4px;
  margin-left: auto;
}

.concept-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.concept-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  transition: transform 0.15s;
  cursor: pointer;
}

.concept-tag:hover { transform: translateY(-1px); }

.tag-core { background: var(--core-bg); color: var(--core); border: 1px solid #fecaca; }
.tag-involve { background: var(--involve-bg); color: var(--involve); border: 1px solid #fde68a; }
.tag-bandwagon { background: var(--bandwagon-bg); color: var(--bandwagon); border: 1px solid #e5e7eb; }

.tag-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

.tag-core .tag-dot { background: var(--core); }
.tag-involve .tag-dot { background: var(--involve); }
.tag-bandwagon .tag-dot { background: var(--bandwagon); }

.concept-section {
  margin-bottom: 24px;
}

.concept-section-title {
  font-size: 15px;
  font-weight: 600;
  padding: 12px 24px;
  background: #fafbfc;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.concept-section-title:hover { background: #f3f4f6; }

.concept-section-count {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-secondary);
}

.status-subsection {
  padding: 0;
}

.status-subtitle {
  font-size: 13px;
  font-weight: 500;
  padding: 8px 24px;
  color: var(--text-secondary);
  border-bottom: 1px dashed var(--border);
}

.detail-popup {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  padding: 24px;
  max-width: 500px;
  width: 90%;
  z-index: 1000;
  display: none;
}

.detail-popup.show { display: block; }

.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 999;
  display: none;
}

.detail-overlay.show { display: block; }

.detail-close {
  position: absolute;
  top: 12px; right: 16px;
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--text-secondary);
}

.detail-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.detail-subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
.detail-text { font-size: 14px; line-height: 1.7; color: var(--text); }
.detail-sources { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
.detail-source {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: #f0f5ff;
  color: #5b7fdb;
}

.empty-state {
  padding: 60px 24px;
  text-align: center;
  color: var(--text-secondary);
}

.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 15px; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

@media (max-width: 768px) {
  .header-inner { flex-wrap: wrap; }
  .search-box { flex-direction: column; }
  .main { padding: 16px; }
  .bond-item { padding: 12px 16px; }
  .concept-tags { gap: 4px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">转债概念映射 <span>| 双向查询工具</span></div>
    <span class="stats-badge" id="totalStats">319只转债 · 20个概念</span>
    <a href="index.html" style="margin-left:auto;align-self:center;color:#1a56db;font-size:13px;font-weight:600;text-decoration:none;padding:0 6px">可比转债分析台 →</a>
  </div>
</div>

<div class="main">
  <div class="search-section">
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" 
             placeholder="搜索转债名称/代码/正股名称，或概念名称...">
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="bond">按转债查</button>
        <button class="mode-btn" data-mode="concept">按概念查</button>
      </div>
    </div>
    <div class="concept-filter-bar" id="conceptFilter"></div>
    <div class="status-filter-bar" id="statusFilter">
      <span class="status-filter-label">等级筛选：</span>
      <button class="status-filter-btn active" data-status="全部">全部</button>
      <button class="status-filter-btn" data-status="核心">核心</button>
      <button class="status-filter-btn" data-status="涉及/参与">涉及/参与</button>
      <button class="status-filter-btn" data-status="蹭概念/有潜力">蹭概念/有潜力</button>
    </div>
  </div>

  <div class="result-area">
    <div class="result-header">
      <div class="result-title" id="resultTitle">全部转债</div>
      <div class="result-count" id="resultCount"></div>
    </div>
    <div class="bond-list" id="resultList"></div>
  </div>
</div>

<div class="detail-overlay" id="overlay"></div>
<div class="detail-popup" id="popup">
  <button class="detail-close" id="popupClose">&times;</button>
  <div class="detail-title" id="popupTitle"></div>
  <div class="detail-subtitle" id="popupSubtitle"></div>
  <div class="detail-text" id="popupText"></div>
  <div class="detail-sources" id="popupSources"></div>
</div>

const STATUS_CONFIG = {
  '核心': { cls: 'tag-core', label: '核心' },
  '涉及/参与': { cls: 'tag-involve', label: '涉及/参与' },
  '蹭概念/有潜力': { cls: 'tag-bandwagon', label: '蹭概念/有潜力' }
};

// ===== STATE =====
let mode = 'bond'; // 'bond' | 'concept'
let activeConcept = null;
let searchQuery = '';
let activeStatusFilter = '全部';

// ===== RENDER =====
function renderConceptChips() {
  const filterBar = document.getElementById('conceptFilter');
  filterBar.innerHTML = DATA.concepts.map(c => {
    const active = activeConcept === c ? ' active' : '';
    return `<button class="concept-chip${active}" data-concept="${c}">${c}</button>`;
  }).join('');
}

function renderBondMode() {
  const bonds = filterBonds();
  const title = document.getElementById('resultTitle');
  const count = document.getElementById('resultCount');
  
  if (activeConcept) {
    title.textContent = `概念：${activeConcept}`;
  } else if (searchQuery) {
    title.textContent = `搜索："${searchQuery}"`;
  } else {
    title.textContent = '全部转债';
  }
  count.textContent = `共 ${bonds.length} 只转债`;

  if (bonds.length === 0) {
    document.getElementById('resultList').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">未找到匹配的转债</div>
      </div>`;
    return;
  }

  document.getElementById('resultList').innerHTML = bonds.map(bond => {
    let concepts = bond.concepts;
    if (activeConcept) {
      concepts = concepts.filter(c => c.concept === activeConcept);
    }
    
    const tagsHtml = concepts.map(c => {
      const cfg = STATUS_CONFIG[c.status] || STATUS_CONFIG['涉及/参与'];
      return `<span class="concept-tag ${cfg.cls}" data-bond="${bond.code}" data-concept="${c.concept}" onclick="event.stopPropagation(); showDetail('${bond.code}', '${c.concept}')">
        <span class="tag-dot"></span>${c.concept} · ${cfg.label}
      </span>`;
    }).join('');

    return `<div class="bond-item" onclick="showBondConcepts('${bond.code}')">
      <div class="bond-header">
        <span class="bond-name">${bond.name}</span>
        <span class="bond-code">${bond.code}</span>
        <span class="bond-stock">${bond.stock_name}</span>
        <span class="bond-stock">${bond.stock_code}</span>
        ${bond.industry ? `<span class="bond-industry">${bond.industry}</span>` : ''}
      </div>
      <div class="concept-tags">${tagsHtml}</div>
    </div>`;
  }).join('');
}

function renderConceptMode() {
  const concepts = filterConcepts();
  const title = document.getElementById('resultTitle');
  const count = document.getElementById('resultCount');
  
  title.textContent = searchQuery ? `搜索："${searchQuery}"` : '全部概念';
  count.textContent = `${concepts.length} 个概念`;

  if (concepts.length === 0) {
    document.getElementById('resultList').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-text">未找到匹配的概念</div>
      </div>`;
    return;
  }

  let html = '';
  for (const cn of concepts) {
    const idx = DATA.concept_index[cn];
    
    html += `<div class="concept-section">
      <div class="concept-section-title" onclick="switchToBondMode('${cn}')">
        ${cn} <span class="concept-section-count">(${countFiltered(idx)}只转债)</span>
      </div>`;

    for (const [status, bonds] of Object.entries(idx)) {
      if (!bonds || bonds.length === 0) continue;
      if (activeStatusFilter !== '全部' && status !== activeStatusFilter) continue;
      
      const cfg = STATUS_CONFIG[status] || STATUS_CONFIG['涉及/参与'];
      
      html += `<div class="status-subsection">
        <div class="status-subtitle">${cfg.label} · ${bonds.length}只</div>`;
      
      for (const b of bonds) {
        html += `<div class="bond-item" onclick="showDetail('${b.code}', '${cn}')">
          <div class="bond-header">
            <span class="bond-name">${b.name}</span>
            <span class="bond-code">${b.code}</span>
            <span class="bond-stock">${b.stock_name}</span>
            ${b.detail ? `<span class="bond-industry" style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${b.detail.substring(0,50)}...</span>` : ''}
          </div>
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  document.getElementById('resultList').innerHTML = html;
}

function countFiltered(idx) {
  let total = 0;
  for (const [status, bonds] of Object.entries(idx)) {
    if (!bonds) continue;
    if (activeStatusFilter === '全部' || status === activeStatusFilter) {
      total += bonds.length;
    }
  }
  return total;
}

function render() {
  if (mode === 'bond') {
    renderBondMode();
  } else {
    renderConceptMode();
  }
}

// ===== FILTERS =====
function filterBonds() {
  return DATA.bonds.filter(bond => {
    if (activeConcept) {
      const matched = bond.concepts.filter(c => c.concept === activeConcept);
      if (matched.length === 0) return false;
      if (activeStatusFilter !== '全部' && !matched.some(c => c.status === activeStatusFilter)) return false;
    }
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const matchName = bond.name.toLowerCase().includes(q);
      const matchCode = bond.code.toLowerCase().includes(q);
      const matchStock = bond.stock_name.toLowerCase().includes(q);
      const matchStockCode = bond.stock_code.toLowerCase().includes(q);
      const matchConcept = bond.concepts.some(c => c.concept.toLowerCase().includes(q));
      if (!matchName && !matchCode && !matchStock && !matchStockCode && !matchConcept) return false;
    }
    return true;
  });
}

function filterConcepts() {
  return DATA.concepts.filter(cn => {
    if (!searchQuery) return true;
    return cn.toLowerCase().includes(searchQuery.toLowerCase());
  });
}

// ===== DETAIL POPUP =====
function showDetail(bondCode, conceptName) {
  const bond = DATA.bonds.find(b => b.code === bondCode);
  if (!bond) return;
  const concept = bond.concepts.find(c => c.concept === conceptName);
  if (!concept) return;

  document.getElementById('popupTitle').textContent = `${conceptName} — ${bond.name}`;
  document.getElementById('popupSubtitle').textContent = `${bond.code} · ${bond.stock_name} (${bond.stock_code}) · ${bond.industry || '行业未标注'}`;
  document.getElementById('popupText').textContent = concept.detail || '暂无详细说明';
  document.getElementById('popupSources').innerHTML = (concept.sources || []).map(s => 
    `<span class="detail-source">${s}</span>`
  ).join('');

  document.getElementById('overlay').classList.add('show');
  document.getElementById('popup').classList.add('show');
}

function hideDetail() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('popup').classList.remove('show');
}

function showBondConcepts(bondCode) {
  const bond = DATA.bonds.find(b => b.code === bondCode);
  if (!bond) return;
  document.getElementById('searchInput').value = bond.name;
  searchQuery = bond.name;
  activeConcept = null;
  mode = 'bond';
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === 'bond'));
  renderConceptChips();
  render();
}

function switchToBondMode(conceptName) {
  activeConcept = conceptName;
  mode = 'bond';
  searchQuery = '';
  activeStatusFilter = '全部';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === 'bond'));
  document.querySelectorAll('.status-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.status === '全部'));
  renderConceptChips();
  render();
  document.getElementById('resultList').scrollIntoView({ behavior: 'smooth' });
}

// ===== EVENTS =====
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  if (mode === 'bond') activeConcept = null;
  renderConceptChips();
  render();
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    activeConcept = null;
    searchQuery = '';
    activeStatusFilter = '全部';
    document.getElementById('searchInput').value = '';
    document.getElementById('searchInput').placeholder = mode === 'bond' 
      ? '搜索转债名称/代码/正股名称...' 
      : '搜索概念名称...';
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.status-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.status === '全部'));
    renderConceptChips();
    render();
  });
});

document.getElementById('conceptFilter').addEventListener('click', e => {
  if (e.target.classList.contains('concept-chip')) {
    const cn = e.target.dataset.concept;
    if (activeConcept === cn) {
      activeConcept = null;
    } else {
      activeConcept = cn;
      mode = 'bond';
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === 'bond'));
    }
    searchQuery = '';
    document.getElementById('searchInput').value = '';
    renderConceptChips();
    render();
  }
});

document.getElementById('statusFilter').addEventListener('click', e => {
  if (e.target.classList.contains('status-filter-btn')) {
    activeStatusFilter = e.target.dataset.status;
    document.querySelectorAll('.status-filter-btn').forEach(b => b.classList.toggle('active', b === e.target));
    render();
  }
});

document.getElementById('overlay').addEventListener('click', hideDetail);
document.getElementById('popupClose').addEventListener('click', hideDetail);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') hideDetail();
});

// ===== INIT =====
renderConceptChips();
render();
</script>
</body>
</html>
